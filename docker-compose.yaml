services:
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: your_database_name
      POSTGRES_USER: your_username
      POSTGRES_PASSWORD: your_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: django_web
    command: >
      sh -c "until nc -z db 5432; do echo 'Waiting for the database...'; sleep 1; done;
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py createsuperuser --noinput --username admin --email admin@example.com --password 123 &&
      gunicorn parserBuildTools.wsgi:application --bind 0.0.0.0:8000 "

    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - .:/app
      - static_data:/app/static
    environment:
      DJANGO_SETTINGS_MODULE: parserBuildTools.settings
      DATABASE_URL: postgres://your_username:your_password@db:5432/your_database_name

  worker:
    build: .
    container_name: celery_worker
    command: >
      sh -c "celery --workdir=./ -A parserBuildTools worker --loglevel=info"
    depends_on:
      - web
      - redis
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: parserBuildTools.settings
      CELERY_BROKER_URL: redis://redis:6379/0

  celery-beats:
    build: .
    container_name: celery_beat
    command: >
      sh -c "celery --workdir=./ -A parserBuildTools beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    depends_on:
      - web
      - redis
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: parserBuildTools.settings
      CELERY_BROKER_URL: redis://redis:6379/0

volumes:
  static_data:
  postgres_data:
