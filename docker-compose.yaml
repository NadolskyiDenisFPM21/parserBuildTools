services:
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: parserBuildTools
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: django_web
    command: >
      sh -c "until nc -z db 5432; do echo 'Waiting for the database...'; sleep 1; done;
      python manage.py collectstatic --noinput &&
      python manage.py makemigrations &&
      python manage.py migrate &&
      uvicorn parserBuildTools.asgi:application --host 0.0.0.0 --port 8000 "

    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - .:/app
      - static_data:/app/static
    environment:
      DJANGO_SETTINGS_MODULE: parserBuildTools.settings
      DATABASE_URL: postgres://postgres:postgres@db:5432/parserBuildTools

  worker:
    build: .
    container_name: celery_worker
    command: >
      sh -c "celery --workdir=./ -A parserBuildTools worker --loglevel=info"
    depends_on:
      - web
      - redis
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: parserBuildTools.settings
      CELERY_BROKER_URL: redis://redis:6379/0

  celery-beats:
    build: .
    container_name: celery_beat
    command: >
      sh -c "celery --workdir=./ -A parserBuildTools beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    depends_on:
      - web
      - redis
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: parserBuildTools.settings
      CELERY_BROKER_URL: redis://redis:6379/0

volumes:
  static_data:
  postgres_data:
